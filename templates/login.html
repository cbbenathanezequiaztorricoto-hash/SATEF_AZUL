<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATEF-AZUL | Iniciar Sesión</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="brand">
            <!-- LOGO EN GRANDE -->
            <img src="{{ url_for('static', filename='img/logo_trans_azul.png') }}" alt="Trans Azul Logo" class="login-logo mb-3" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3448/3448339.png'">
            <h2>SATEF-AZUL</h2>
            <p class="text-muted">Detección y Monitoreo de Fatiga - Trans Azul</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <!-- AGREGA ESTA LÍNEA DENTRO DEL FORM -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
            </button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
